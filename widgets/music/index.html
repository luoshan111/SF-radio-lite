<!DOCTYPE html>
<html lang="zh-CN" data-motion="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ 音乐歌词</title>
<style>
  /* Hallmark · component: desktop music card · genre: atmospheric · theme: incumbent amber glass
   * states: default · hover · focus · active · disabled · loading · error · success
   * studied reference: user-provided music card · pre-emit critique: P4 H4 E4 S5 R4 V4
   */
  * { box-sizing: border-box; }

  :root {
    color-scheme: dark;
    --surface: rgba(20, 23, 29, 0.94);
    --surface-raised: rgba(255, 255, 255, 0.065);
    --surface-hover: rgba(255, 255, 255, 0.1);
    --surface-menu: #242832;
    --surface-menu-selected: #493b2a;
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #f4f5f7;
    --text-secondary: #b8bdc8;
    --text-muted: #969eaa;
    --accent: #f0b35a;
    --accent-soft: rgba(240, 179, 90, 0.14);
    --success: #66c79a;
    --danger: #ff887b;
    --radius: 8px;
    --ease: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    --font-display: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --font-body: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    --font-data: "Cascadia Mono", "Consolas", monospace;
    --color-canvas: oklch(16% 0.012 250);
    --color-player-surface: oklch(22% 0.015 250 / 0.78);
    --color-player-raised: oklch(29% 0.018 250 / 0.86);
    --color-player-track: oklch(42% 0.012 250 / 0.7);
    --color-player-ink: oklch(96% 0.008 75);
    --color-player-muted: oklch(76% 0.012 250);
    --color-player-accent: oklch(79% 0.13 72);
    --color-player-focus: oklch(84% 0.14 72);
    --color-player-error: oklch(72% 0.16 28);
    --color-player-success: oklch(76% 0.13 155);
    --color-backdrop-overlay-start: oklch(14% 0.012 250 / 0.58);
    --color-backdrop-overlay-end: oklch(12% 0.012 250 / 0.94);
    --color-player-border: oklch(94% 0.008 75 / 0.18);
    --color-player-divider: oklch(94% 0.008 75 / 0.08);
    --color-player-shadow: oklch(8% 0.01 250 / 0.28);
    --color-player-album: oklch(68% 0.012 250);
    --color-player-section: oklch(16% 0.012 250 / 0.34);
    --color-player-footer: oklch(14% 0.012 250 / 0.66);
    --color-player-mode: oklch(66% 0.012 250);
    --player-cover-size: 144px;
    --player-module-gap: 12px;
    --player-inline-pad: 14px;
    --dur-micro: 120ms;
    --dur-short: 220ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ── 动效 token：每个组件一个变量，动画规则只引用自己的变量；
     总开关 <html data-motion="off"> 把全部 token 归零，组件代码无需感知。
     曲线与时长对齐 iOS：淡入 + 轻缩放浮现（fade-through），微交互带轻微回弹 ── */
  :root {
    --motion-panel: 380ms;
    --motion-panel-ease: cubic-bezier(0.32, 0.72, 0, 1);
    --motion-leave: 170ms;
    --motion-lyrics: 280ms;
    --motion-row: 140ms;
    --motion-row-press: cubic-bezier(0.34, 1.3, 0.5, 1);
    --motion-marker: 2.4s;
    --motion-cover: 420ms;
    --motion-settings: 260ms;
    --motion-knob: 300ms cubic-bezier(0.34, 1.45, 0.5, 1);
  }

  :root[data-motion="off"] {
    --motion-panel: 0s;
    --motion-panel-ease: linear;
    --motion-leave: 0s;
    --motion-lyrics: 0s;
    --motion-row: 0s;
    --motion-row-press: linear;
    --motion-marker: 0s;
    --motion-cover: 0s;
    --motion-settings: 0s;
    --motion-knob: 0s linear;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    color: var(--text);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    user-select: none;
  }

  button,
  input {
    font: inherit;
  }

  button {
    color: inherit;
  }

  .widget {
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background:
      linear-gradient(180deg, rgba(36, 40, 49, 0.92), rgba(18, 21, 27, 0.97)),
      var(--surface);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 16px 42px rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(22px) saturate(135%);
    -webkit-backdrop-filter: blur(22px) saturate(135%);
  }

  .titlebar {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    min-height: 50px;
    padding: 9px 10px 8px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.055);
  }

  .brand {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 9px;
  }

  .brand-mark {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    overflow: hidden;
    border-radius: 6px;
  }

  .brand-mark img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .brand-copy {
    min-width: 0;
  }

  .brand h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 650;
    letter-spacing: 0;
    line-height: 1.2;
  }

  .playback-status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    color: var(--text-muted);
    font-size: 10px;
    line-height: 1;
    white-space: nowrap;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    flex: 0 0 6px;
    border-radius: 50%;
    background: #69717e;
    transition: background-color var(--ease), opacity var(--ease);
  }

  .status-dot.playing {
    background: var(--success);
  }

  .status-dot.error {
    background: var(--danger);
  }

  @media (prefers-reduced-motion: no-preference) {
    .status-dot.playing {
      animation: status-pulse 1.8s ease-in-out infinite;
    }
  }

  @keyframes status-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.42; }
  }

  .window-actions {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    margin-left: auto;
    padding-left: 12px;
  }

  .icon-button {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: "Segoe UI Symbol", sans-serif;
    font-size: 17px;
    line-height: 1;
    transition: background-color var(--ease), color var(--ease), transform var(--ease);
  }

  .icon-button:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .icon-button:active {
    transform: scale(0.94);
  }

  .icon-button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .widget.settings-open .top-region,
  .widget.settings-open .lyrics-section,
  .widget.settings-open .footer {
    display: none;
  }

  .settings-page {
    grid-row: 2 / -1;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    min-height: 0;
    padding: 14px;
  }

  .settings-page.hidden {
    display: none;
  }

  .settings-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
    padding: 0 1px 11px;
  }

  .settings-heading h2 {
    margin: 0;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
  }

  .settings-heading p {
    margin: 0;
    color: var(--text-muted);
    font-size: 10px;
    white-space: nowrap;
  }

  .settings-tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.035);
  }

  .settings-tab {
    min-height: 31px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    transition: background-color var(--ease), color var(--ease);
  }

  .settings-tab:hover {
    color: var(--text-secondary);
  }

  .settings-tab[aria-selected="true"] {
    background: var(--surface-hover);
    color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .settings-content {
    min-height: 0;
    overflow-y: auto;
    padding: 12px 1px 4px;
    scrollbar-gutter: stable;
  }

  .settings-content::-webkit-scrollbar {
    width: 4px;
  }

  .settings-content::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.13);
  }

  .settings-panel.hidden {
    display: none;
  }

  .setting-section + .setting-section {
    margin-top: 16px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
  }

  .setting-section-title {
    margin-bottom: 9px;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
  }

  .setting-row,
  .setting-control {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 38px;
  }

  .setting-row + .setting-row,
  .setting-control + .setting-control {
    margin-top: 4px;
  }

  .setting-label {
    min-width: 0;
    color: var(--text-secondary);
    font-size: 11px;
    line-height: 1.4;
  }

  .setting-label small {
    display: block;
    margin-top: 2px;
    color: var(--text-muted);
    font-size: 10px;
  }

  .setting-select {
    width: 134px;
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    background: var(--surface-raised);
    color: var(--text);
    cursor: pointer;
    font-size: 11px;
  }

  .setting-select:focus {
    border-color: rgba(240, 179, 90, 0.72);
  }

  .setting-select option {
    background-color: var(--surface-menu);
    color: var(--text);
  }

  .setting-select option:checked {
    background-color: var(--surface-menu-selected);
    color: #fff4e3;
  }

  .range-control {
    display: flex;
    align-items: center;
    width: 144px;
    gap: 8px;
  }

  .range-control input[type="range"] {
    width: 104px;
    accent-color: var(--accent);
  }

  .range-value {
    width: 30px;
    color: var(--accent);
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 10px;
    text-align: right;
  }

  .color-control {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .color-control input[type="color"] {
    width: 31px;
    height: 27px;
    padding: 2px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--surface-raised);
    cursor: pointer;
  }

  .color-value {
    color: var(--text-muted);
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 10px;
    text-transform: uppercase;
  }

  .segmented {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.035);
  }

  .segment {
    min-width: 44px;
    height: 25px;
    padding: 0 7px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 10px;
    transition: background-color var(--ease), color var(--ease);
  }

  .segment[aria-pressed="true"] {
    background: var(--surface-hover);
    color: var(--text);
  }

  .toggle {
    position: relative;
    display: inline-flex;
    width: 38px;
    height: 22px;
    flex: 0 0 38px;
  }

  .toggle input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }

  .toggle-track {
    width: 100%;
    height: 100%;
    padding: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.15);
    cursor: pointer;
    transition: background-color var(--ease);
  }

  .toggle-track::after {
    display: block;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #d5dae2;
    content: "";
    transition: transform var(--motion-knob), background-color var(--ease);
  }

  .toggle input:checked + .toggle-track {
    background: var(--accent);
  }

  .toggle input:checked + .toggle-track::after {
    transform: translateX(16px);
    background: #272118;
  }

  .toggle input:focus-visible + .toggle-track {
    outline: 2px solid rgba(240, 179, 90, 0.9);
    outline-offset: 2px;
  }

  .toggle input:disabled + .toggle-track {
    cursor: wait;
    opacity: 0.55;
  }

  .theme-preview {
    position: relative;
    isolation: isolate;
    min-height: 68px;
    overflow: hidden;
    margin-bottom: 14px;
    padding: 15px 13px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--preview-background, transparent);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .theme-preview::before {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.035), transparent 45%, rgba(255,255,255,0.025));
    content: "";
  }

  .preview-title,
  .preview-lyric {
    position: relative;
    z-index: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .preview-title {
    color: var(--preview-title, var(--accent));
    font-size: 11px;
    font-weight: 700;
  }

  .preview-lyric {
    margin-top: 6px;
    color: var(--preview-text, var(--text));
    font-size: var(--preview-size, 16px);
    font-weight: var(--preview-weight, 700);
    text-shadow: var(--preview-shadow, 1px 1px 0 #000);
  }

  .settings-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 16px;
    padding-top: 13px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
  }

  .save-status {
    min-width: 0;
    color: var(--text-muted);
    font-size: 10px;
  }

  .save-status.error {
    color: var(--danger);
  }

  .secondary-action {
    min-height: 30px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-raised);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 10px;
    transition: background-color var(--ease), color var(--ease), border-color var(--ease);
  }

  .secondary-action:hover {
    border-color: var(--border-strong);
    background: var(--surface-hover);
    color: var(--text);
  }

  .top-region {
    position: relative;
    z-index: 3;
    padding: 13px 14px 11px;
  }

  .song-info {
    -webkit-app-region: no-drag;
    min-width: 0;
    margin-bottom: 11px;
  }

  .song-info.hidden {
    display: none;
  }

  .song-title {
    overflow: hidden;
    color: var(--text);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .song-artist {
    overflow: hidden;
    margin-top: 3px;
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1.4;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-wrap {
    -webkit-app-region: no-drag;
    position: relative;
  }

  .search-bar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 7px;
  }

  .search-bar input {
    width: 100%;
    min-width: 0;
    height: 36px;
    padding: 0 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    outline: none;
    background: rgba(255, 255, 255, 0.045);
    color: var(--text);
    font-size: 12px;
    transition: border-color var(--ease), background-color var(--ease), box-shadow var(--ease);
  }

  .search-bar input::placeholder {
    color: var(--text-muted);
    opacity: 1;
  }

  .search-bar input:hover {
    border-color: var(--border-strong);
    background: rgba(255, 255, 255, 0.06);
  }

  .search-bar input:focus {
    border-color: rgba(240, 179, 90, 0.72);
    background: rgba(255, 255, 255, 0.075);
    box-shadow: 0 0 0 3px rgba(240, 179, 90, 0.1);
  }

  .search-button {
    min-width: 58px;
    height: 36px;
    padding: 0 13px;
    border: 1px solid rgba(240, 179, 90, 0.7);
    border-radius: 7px;
    background: var(--accent);
    color: #262016;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    transition: filter var(--ease), transform var(--ease), opacity var(--ease);
  }

  .search-button:hover {
    filter: brightness(1.07);
  }

  .search-button:active {
    transform: translateY(1px);
  }

  .search-button:disabled {
    cursor: wait;
    opacity: 0.62;
  }

  /* 内容视图统一钉在第 2 行：淡出/浮现交叉时不会互相推挤 */
  .lyrics-area, .playlist-panel, .search-results { grid-row: 2; }

  /* 搜索结果：与歌词/歌单并列的内容视图（不再是浮动下拉层） */
  .search-results {
    min-height: 0;
    overflow-y: auto;
    padding: 6px 10px 10px;
    overscroll-behavior: contain;
  }

  .search-results.hidden {
    display: none;
  }

  .result-item {
    display: block;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    text-align: left;
    cursor: pointer;
    transition: background-color var(--ease);
  }

  .result-item:hover,
  .result-item:focus-visible {
    outline: none;
    background: var(--surface-hover);
  }

  .result-item + .result-item {
    margin-top: 2px;
  }

  .result-name {
    overflow: hidden;
    color: var(--text);
    font-size: 12px;
    font-weight: 650;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .result-meta,
  .search-message {
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.45;
  }

  .result-meta {
    overflow: hidden;
    margin-top: 2px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-message {
    padding: 13px 11px;
    text-align: center;
  }

  .search-message.error {
    color: var(--danger);
  }

  .lyrics-area {
    -webkit-app-region: no-drag;
    position: relative;
    min-height: 0;
    overflow-y: auto;
    padding: 0 18px 18px;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
    scrollbar-gutter: stable;
  }

  .lyrics-area::-webkit-scrollbar,
  .search-results::-webkit-scrollbar {
    width: 4px;
  }

  .lyrics-area::-webkit-scrollbar-track,
  .search-results::-webkit-scrollbar-track {
    background: transparent;
  }

  .lyrics-area::-webkit-scrollbar-thumb,
  .search-results::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.13);
  }

  .lyric-pair {
    padding: 8px 0;
    text-align: center;
    transition: opacity var(--motion-lyrics) ease, transform var(--motion-lyrics) ease,
                filter var(--motion-lyrics) ease;
  }

  .lyric-line {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.55;
    overflow-wrap: anywhere;
    transition: color var(--motion-lyrics) ease, font-weight var(--motion-lyrics) ease;
  }

  .lyric-trans {
    margin-top: 3px;
    color: rgba(184, 189, 200, 0.55);
    font-size: 11px;
    line-height: 1.45;
    overflow-wrap: anywhere;
    transition: color var(--motion-lyrics) ease;
  }

  .lyric-pair.past {
    opacity: 0.4;
    filter: blur(0.8px);
  }

  .lyric-pair.active {
    opacity: 1;
    transform: scale(1.025);
  }

  .lyric-pair.active .lyric-line {
    color: var(--accent);
    font-weight: 750;
  }

  .lyric-pair.active .lyric-trans {
    color: rgba(240, 179, 90, 0.68);
  }

  .lyrics-spacer-top,
  .lyrics-spacer-bottom {
    height: 36%;
    min-height: 92px;
  }

  .empty-state {
    display: flex;
    min-height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 22px 24px 36px;
    text-align: center;
  }

  .empty-mark {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    margin-bottom: 15px;
    border: 1px solid rgba(240, 179, 90, 0.22);
    border-radius: 50%;
    background: rgba(240, 179, 90, 0.08);
    color: var(--accent);
    font-family: "Segoe UI Symbol", sans-serif;
    font-size: 25px;
    line-height: 1;
  }

  .empty-title {
    margin: 0;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 650;
  }

  .empty-copy {
    max-width: 24ch;
    margin: 7px 0 0;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.65;
  }

  .footer {
    -webkit-app-region: no-drag;
    position: relative;
    z-index: 2;
    padding: 10px 14px 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.065);
    background: rgba(12, 15, 20, 0.42);
  }

  .progress-row {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) 34px;
    align-items: center;
    gap: 8px;
  }

  .time-label {
    color: var(--text-muted);
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .time-label:last-child {
    text-align: right;
  }

  .progress-bar {
    position: relative;
    height: 3px;
    overflow: hidden;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.1);
  }

  .progress-fill {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 260ms linear;
  }

  .offset-row {
    display: grid;
    grid-template-columns: minmax(54px, 1fr) repeat(2, 36px) 48px repeat(2, 36px);
    align-items: center;
    gap: 5px;
    margin-top: 10px;
  }

  .offset-label {
    color: var(--text-muted);
    font-size: 10px;
    white-space: nowrap;
  }

  .step-button {
    height: 30px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-raised);
    color: var(--text-secondary);
    cursor: pointer;
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 9px;
    line-height: 1;
    transition: background-color var(--ease), border-color var(--ease), color var(--ease), transform var(--ease);
  }

  .step-button:hover {
    border-color: var(--border-strong);
    background: var(--surface-hover);
    color: var(--text);
  }

  .step-button:active {
    transform: scale(0.95);
  }

  .offset-value {
    color: var(--accent);
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  /* Music-card modules stay independent so later iterations can reorder them. */
  .widget {
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    background: var(--color-canvas);
  }

  .widget > :not(.artwork-backdrop) {
    position: relative;
    z-index: 1;
  }

  .artwork-backdrop {
    position: absolute;
    inset: -22px;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .artwork-backdrop::after {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--color-backdrop-overlay-start), var(--color-backdrop-overlay-end));
    content: "";
  }

  .artwork-backdrop img {
    width: 100%;
    height: 100%;
    opacity: 0;
    object-fit: cover;
    filter: blur(28px) saturate(0.9);
    transform: scale(1.12);
    transition: opacity var(--motion-cover) var(--ease-out);
  }

  .artwork-backdrop img.is-loaded {
    opacity: 0.54;
  }

  .titlebar {
    min-height: 48px;
    border-bottom-color: var(--color-player-divider);
    background: oklch(16% 0.012 250 / 0.3);
  }

  .top-region {
    display: grid;
    gap: var(--player-module-gap);
    min-width: 0;
    min-height: 0;
    padding: var(--player-module-gap) var(--player-inline-pad) 10px;
  }

  .now-playing {
    display: grid;
    grid-template-columns: var(--player-cover-size) minmax(0, 1fr);
    align-items: end;
    gap: 14px;
    min-width: 0;
  }

  .cover-frame {
    position: relative;
    width: var(--player-cover-size);
    aspect-ratio: 1;
    overflow: hidden;
    border: 1px solid var(--color-player-border);
    border-radius: 8px;
    background: var(--color-player-raised);
    box-shadow: 0 14px 28px var(--color-player-shadow);
  }

  .cover-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    object-fit: cover;
    transform: scale(1.015);
    transition: opacity var(--motion-cover) var(--ease-out), transform var(--motion-cover) var(--ease-out);
  }

  .cover-frame.has-cover .cover-image {
    opacity: 1;
    transform: none;
  }

  .cover-fallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 7px;
    color: var(--color-player-muted);
    font-family: var(--font-body);
    font-size: 10px;
    text-align: center;
    transition: opacity var(--dur-micro) var(--ease-out);
  }

  .cover-frame.has-cover .cover-fallback {
    opacity: 0;
  }

  .cover-note {
    color: var(--color-player-accent);
    font-family: "Segoe UI Symbol", sans-serif;
    font-size: 34px;
    line-height: 1;
  }

  .now-playing .song-info {
    min-width: 0;
    margin: 0 0 2px;
  }

  .song-kicker {
    margin-bottom: 8px;
    color: var(--color-player-accent);
    font-family: var(--font-data);
    font-size: 10px;
    line-height: 1;
  }

  .now-playing .song-title {
    display: -webkit-box;
    overflow: hidden;
    color: var(--color-player-ink);
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 700;
    line-height: 1.25;
    text-overflow: initial;
    white-space: normal;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .now-playing .song-artist {
    overflow: hidden;
    margin-top: 6px;
    color: var(--color-player-muted);
    font-family: var(--font-body);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .song-album {
    overflow: hidden;
    margin-top: 4px;
    color: var(--color-player-album);
    font-family: var(--font-body);
    font-size: 10px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-wrap {
    margin-top: 1px;
  }

  .search-bar input {
    background: var(--color-player-surface);
  }

  .lyrics-section {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    border-top: 1px solid var(--color-player-divider);
    background: var(--color-player-section);
  }

  .lyrics-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 32px;
    padding: 7px var(--player-inline-pad) 5px;
    color: var(--color-player-muted);
    font-family: var(--font-body);
    font-size: 10px;
  }

  .lyrics-mode {
    color: var(--color-player-mode);
  }

  .lyrics-area {
    padding: 0 20px 10px;
  }

  .lyric-pair {
    padding: 7px 0;
  }

  .lyric-line {
    color: var(--color-player-muted);
  }

  .lyric-pair.active .lyric-line {
    color: var(--color-player-accent);
  }

  .footer {
    display: grid;
    min-width: 0;
    min-height: 0;
    gap: 6px;
    padding: 9px var(--player-inline-pad) 11px;
    border-top-color: var(--color-player-border);
    background: var(--color-player-footer);
  }

  .progress-row {
    grid-template-columns: 38px minmax(0, 1fr) 38px;
    gap: 7px;
  }

  .progress-seek {
    --seek-progress: 0%;
    width: 100%;
    height: 28px;
    margin: 0;
    padding: 0;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }

  .progress-seek::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 4px;
    background: linear-gradient(
      to right,
      var(--color-player-accent) 0 var(--seek-progress),
      var(--color-player-track) var(--seek-progress) 100%
    );
  }

  .progress-seek::-webkit-slider-thumb {
    width: 14px;
    height: 14px;
    margin-top: -5px;
    appearance: none;
    border: 3px solid var(--color-player-ink);
    border-radius: 50%;
    background: var(--color-player-accent);
  }

  .progress-seek:focus-visible {
    outline-color: var(--color-player-focus);
  }

  .transport-row {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 44px 52px 44px minmax(0, 1fr);
    align-items: center;
    justify-items: center;
    gap: 8px;
    min-height: 52px;
  }

  .control-status {
    justify-self: start;
    overflow: hidden;
    max-width: 64px;
    color: var(--color-player-muted);
    font-family: var(--font-body);
    font-size: 10px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .control-status.error {
    color: var(--color-player-error);
  }

  .transport-button {
    position: relative;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 50%;
    background: transparent;
    color: var(--color-player-ink);
    cursor: pointer;
    font-family: "Segoe UI Symbol", sans-serif;
    font-size: 22px;
    line-height: 1;
    transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out), opacity var(--dur-micro) var(--ease-out);
  }

  .transport-button:active,
  .transport-button[data-state="active"] {
    transform: translateY(1px);
  }

  .transport-button:focus-visible {
    outline-color: var(--color-player-focus);
  }

  .transport-button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .transport-button-primary {
    width: 52px;
    height: 52px;
    background: var(--color-player-ink);
    color: var(--color-canvas);
    font-size: 24px;
  }

  .transport-button[data-state="loading"] {
    color: transparent;
  }

  .transport-button[data-state="loading"]::after {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2px solid var(--color-player-muted);
    border-top-color: var(--color-player-accent);
    border-radius: 50%;
    content: "";
    animation: transport-spin 700ms linear infinite;
  }

  .transport-button[data-state="error"] {
    border-color: var(--color-player-error);
    color: var(--color-player-error);
  }

  .transport-button[data-state="success"] {
    border-color: var(--color-player-success);
  }

  @keyframes transport-spin {
    to { transform: rotate(360deg); }
  }

  .transport-balance {
    width: 64px;
  }

  .offset-row {
    margin-top: 0;
  }

  @media (hover: hover) {
    .transport-button:hover {
      background: var(--color-player-raised);
    }

    .transport-button-primary:hover {
      background: var(--color-player-accent);
      color: var(--color-canvas);
    }
  }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid rgba(240, 179, 90, 0.9);
    outline-offset: 2px;
  }

  @media (max-height: 520px) {
    .titlebar { min-height: 44px; }
    .top-region { padding-top: 9px; padding-bottom: 9px; }
    .song-info { margin-bottom: 8px; }
    .lyrics-spacer-top,
    .lyrics-spacer-bottom { min-height: 64px; }
    .footer { padding-top: 8px; padding-bottom: 9px; }
    .offset-row { margin-top: 8px; }
    .settings-page { padding-top: 9px; }
    .settings-content { padding-top: 9px; }
  }

  @media (max-width: 340px), (max-height: 650px) {
    :root {
      --player-cover-size: 112px;
      --player-module-gap: 9px;
      --player-inline-pad: 11px;
    }

    .now-playing {
      gap: 11px;
    }

    .now-playing .song-title {
      font-size: 16px;
    }

    .song-kicker {
      margin-bottom: 5px;
    }

    .lyrics-heading {
      min-height: 28px;
    }

    .footer {
      gap: 3px;
      padding-top: 6px;
      padding-bottom: 7px;
    }

    .transport-row {
      min-height: 46px;
    }

    .transport-button-primary {
      width: 46px;
      height: 46px;
    }

    .offset-row {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (prefers-reduced-transparency: reduce) {
    .widget {
      background: var(--color-canvas);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .artwork-backdrop {
      display: none;
    }
  }
  .content-tabs { display: flex; gap: 4px; }
  .content-tab {
    border: 0; border-radius: 5px; padding: 5px 9px;
    background: transparent; color: var(--text-muted); cursor: pointer;
    font-size: 12px;
  }
  .content-tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
  .content-tab:focus-visible, .playlist-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lyrics-section.queue-open .lyrics-area, .lyrics-section.queue-open .lyrics-mode { display: none; }
  .playlist-panel {
    display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
    min-height: 0; padding: 0 14px 10px; gap: 8px;
  }
  .playlist-panel.hidden { display: none; }
  .playlist-toolbar, .playlist-pagination { display: flex; align-items: center; gap: 8px; }
  .playlist-toolbar .playlist-count { flex: 1; font-size: 11px; color: var(--text-secondary); }
  .playlist-toolbar button, .playlist-pagination button {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface-raised); color: var(--text-secondary); font-size: 11px; cursor: pointer;
  }
  .playlist-toolbar button:hover, .playlist-pagination button:hover { color: var(--accent); }
  .playlist-panel button:disabled { opacity: .45; cursor: wait; }
  .playlist-message { margin: 0; color: var(--text-muted); font-size: 11px; line-height: 1.5; }
  .playlist-message.error { color: var(--danger); }
  .playlist-items { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #493b2a transparent; }
  .playlist-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px;
    width: 100%; padding: 10px 9px; text-align: left; border: 0;
    border-bottom: 1px solid var(--border); border-radius: 5px;
    background: transparent; cursor: pointer;
    transition: background var(--motion-row) ease, transform var(--motion-row-press) 140ms;
  }
  .playlist-row:hover { background: var(--surface-hover); }
  .playlist-row:active { transform: scale(0.98); }
  .playlist-row[aria-current="true"] { background: var(--accent-soft); }
  .playlist-title { grid-column: 1; font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .playlist-artist { grid-column: 1; color: var(--text-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .playlist-row[aria-current="true"] .playlist-marker { animation: none; }
  body.is-playing .playlist-row[aria-current="true"] .playlist-marker { animation: marker-breath var(--motion-marker) ease-in-out infinite; }
  .playlist-marker { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 10px; color: var(--accent); }
  body.doc-hidden *, body.doc-hidden *::before, body.doc-hidden *::after {
    animation-play-state: paused !important;
  }

  @keyframes marker-breath {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  .playlist-pagination { justify-content: space-between; }
  .playlist-pagination span { font-size: 10px; color: var(--text-muted); }
  .mine-card {
    display: flex; gap: 10px; align-items: center; width: 100%;
    padding: 8px 9px; text-align: left; border: 0;
    border-bottom: 1px solid var(--border); border-radius: 5px;
    background: transparent; cursor: pointer;
  }
  .mine-card:hover { background: var(--surface-hover); }
  .mine-cover {
    width: 44px; height: 44px; flex: 0 0 44px;
    border-radius: 5px; object-fit: cover; background: var(--surface-raised);
  }
  .mine-card-text { display: grid; gap: 3px; min-width: 0; flex: 1; }
  .mine-song { grid-template-columns: 36px minmax(0, 1fr) auto; }
  .mine-song .playlist-cover {
    grid-column: 1; grid-row: 1 / span 2; align-self: center;
    width: 36px; height: 36px; border-radius: 4px; object-fit: cover;
    background: var(--surface-raised);
  }
  .mine-song .playlist-title { grid-column: 2; }
  .mine-song .playlist-artist { grid-column: 2; }
  .mine-song .playlist-marker { grid-column: 3; grid-row: 1 / span 2; }

  /* ── 视图浮现/隐去（iOS fade-through：淡入 + 轻缩放 + 上浮） ── */
  @keyframes view-emerge {
    from { opacity: 0; transform: scale(0.965) translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes view-leave {
    to { opacity: 0; transform: scale(0.985) translateY(4px); }
  }
  .view-leaving {
    animation: view-leave var(--motion-leave) ease-in forwards !important;
    pointer-events: none;
  }
  .playlist-panel:not(.hidden) { animation: view-emerge var(--motion-panel) var(--motion-panel-ease); }
  .settings-page:not(.hidden) { animation: view-emerge var(--motion-settings) var(--motion-panel-ease); }
  .lyrics-section:not(.queue-open) .lyrics-area { animation: view-emerge var(--motion-panel) var(--motion-panel-ease); }

  /* ── 省电模式：关闭持续运行的装饰动画（窗口透明度在重启时由 main.py 应用）── */
  body.power-saving .status-dot.playing { animation: none; }
  body.power-saving .playlist-row[aria-current="true"] .playlist-marker { animation: none; }
</style>
</head>
<body>
<main class="widget">
  <div class="artwork-backdrop" aria-hidden="true">
    <img id="albumBackdrop" src="../../assets/icons/bizhi.png" alt="">
  </div>

  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><img src="../../assets/icons/bizhi.png" alt=""></span>
      <div class="brand-copy">
        <h1>QQ 音乐歌词</h1>
        <div class="playback-status" aria-live="polite">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusLabel">等待播放</span>
        </div>
      </div>
    </div>
    <div class="window-actions">
      <button class="icon-button" id="settingsButton" type="button" onclick="toggleSettings()" title="打开设置" aria-label="打开设置" aria-pressed="false">&#9881;&#65038;</button>
      <button class="icon-button" type="button" onclick="minimizeWin()" title="最小化" aria-label="最小化">&#8722;</button>
    </div>
  </header>

  <section class="settings-page hidden" id="settingsPage">
    <div class="settings-heading">
      <h2>设置</h2>
      <p id="settingsSaveStatus">实时保存</p>
    </div>

    <div class="settings-tabs" role="tablist" aria-label="设置分类">
      <button class="settings-tab" id="generalTab" type="button" role="tab" aria-selected="true" aria-controls="generalPanel" onclick="setSettingsTab('general')">常规</button>
      <button class="settings-tab" id="taskbarTab" type="button" role="tab" aria-selected="false" aria-controls="taskbarPanel" onclick="setSettingsTab('taskbar')">任务栏样式</button>
    </div>

    <div class="settings-content">
      <section class="settings-panel" id="generalPanel" role="tabpanel" aria-labelledby="generalTab">
        <div class="setting-section">
          <div class="setting-section-title">显示内容</div>
          <label class="setting-row" for="taskbarEnabled">
            <span class="setting-label">任务栏歌词<small>关闭后任务栏文字会立即隐藏</small></span>
            <span class="toggle"><input id="taskbarEnabled" type="checkbox" data-theme-control="enabled"><span class="toggle-track"></span></span>
          </label>
          <label class="setting-row" for="taskbarShowTitle">
            <span class="setting-label">显示歌曲名<small>为歌词预留一段标题空间</small></span>
            <span class="toggle"><input id="taskbarShowTitle" type="checkbox" data-theme-control="show_title"><span class="toggle-track"></span></span>
          </label>
        </div>

        <div class="setting-section">
          <div class="setting-section-title">界面</div>
          <label class="setting-row" for="motionEnabled">
            <span class="setting-label">动效<small>面板切换、歌词滚动等界面动画，关闭后立即生效</small></span>
            <span class="toggle"><input id="motionEnabled" type="checkbox" checked><span class="toggle-track"></span></span>
          </label>
          <label class="setting-row" for="powerSaving">
            <span class="setting-label">省电模式<small>关闭呼吸动画、窗口改为不透明，显著降低 CPU；透明度需重启挂件生效</small></span>
            <span class="toggle"><input id="powerSaving" type="checkbox"><span class="toggle-track"></span></span>
          </label>
        </div>

        <div class="setting-section">
          <div class="setting-section-title">系统</div>
          <label class="setting-row" for="autostartEnabled">
            <span class="setting-label">开机自启动<small>登录 Windows 后自动运行 BIZHI</small></span>
            <span class="toggle"><input id="autostartEnabled" type="checkbox" data-autostart-control><span class="toggle-track"></span></span>
          </label>
        </div>
      </section>

      <section class="settings-panel hidden" id="taskbarPanel" role="tabpanel" aria-labelledby="taskbarTab">

            </span>

          <label class="setting-control" for="themeBackgroundColor">
            <span class="setting-label">背景颜色</span>
            <span class="color-control"><input id="themeBackgroundColor" type="color" value="#171a20" data-theme-control="background_color"><span class="color-value" id="themeBackgroundColorValue">#171A20</span></span>
          </label>

        <div class="settings-actions">
          <span class="save-status" id="taskbarSaveStatus">调整后自动保存</span>
          <button class="secondary-action" type="button" onclick="resetTaskbarTheme()">恢复默认</button>
        </div>

  <section class="top-region">

      <button class="step-button" type="button" onclick="adjustOffset(-500)" aria-label="歌词提前 0.5 秒">-0.5</button>
      <button class="step-button" type="button" onclick="adjustOffset(-100)" aria-label="歌词提前 0.1 秒">-0.1</button>
      <span class="offset-value" id="offsetValue">0.0s</span>
      <button class="step-button" type="button" onclick="adjustOffset(100)" aria-label="歌词延后 0.1 秒">+0.1</button>
      <button class="step-button" type="button" onclick="adjustOffset(500)" aria-label="歌词延后 0.5 秒">+0.5</button>
    </div>

</main>

<script src="js/song-list-panel.js"></script>
<script>
  let lyrics = [];
  let currentIndex = -1;
  let userOffset = null;
  let lrcOffset = 0;
  let syncTimer = null;
  let firstSyncDone = false;
  let syncPoint = null;
  let settingsOpen = false;
  let taskbarTheme = null;
  let themeSaveTimer = null;
  let currentDurationMs = 0;
  let userSeeking = false;
  let displayedMediaKey = "";
  let activeView = "lyrics";
  let viewSwitching = false;

  const themePresets = {
    clear: {
      preset: "clear",
      font_size: 16,
      font_weight: "bold",
      text_color: "#f5f7fa",
      title_color: "#f0b35a",
      effect: "outline",
      background_mode: "transparent",
      background_color: "#171a20"
    },
    amber: {
      preset: "amber",
      font_size: 17,
      font_weight: "bold",
      text_color: "#fff1d2",
      title_color: "#f0b35a",
      effect: "shadow",
      background_mode: "transparent",
      background_color: "#171a20"
    },
    ice: {
      preset: "ice",
      font_size: 16,
      font_weight: "bold",
      text_color: "#e5f5ff",
      title_color: "#7bd3ff",
      effect: "outline",
      background_mode: "transparent",
      background_color: "#171a20"
    },
    contrast: {
      preset: "contrast",
      font_size: 17,
      font_weight: "bold",
      text_color: "#ffffff",
      title_color: "#ffffff",
      effect: "shadow",
      background_mode: "solid",
      background_color: "#101217"
    }
  };

  function waitForApi(timeoutMs = 3000) {
    return new Promise(resolve => {
      const startedAt = Date.now();
      const check = () => {
        if (window.pywebview && window.pywebview.api) {
          resolve(true);
        } else if (Date.now() - startedAt >= timeoutMs) {
          resolve(false);
        } else {
          setTimeout(check, 100);
        }
      };
      check();
    });
  }

  // 动效总开关：CSS 由 <html data-motion> 驱动；JS 动画（歌词滚动）用这里分支。
  function motionOn() {
    return document.documentElement.dataset.motion !== "off";
  }

  function applyMotion(enabled) {
    document.documentElement.dataset.motion = enabled ? "on" : "off";
    const toggle = document.getElementById("motionEnabled");
    if (toggle) toggle.checked = Boolean(enabled);
  }

  async function loadUiMotion() {
    try {
      if (!await waitForApi()) return;
      const result = await window.pywebview.api.get_ui_motion();
      if (result && !result.error) applyMotion(result.enabled);
    } catch (error) {
      /* 默认保持开启 */
    }
  }

  async function setUiMotion(enabled) {
    applyMotion(enabled);   // 先切换视觉，再持久化
    try {
      if (!await waitForApi()) return;
      await window.pywebview.api.set_ui_motion(enabled);
    } catch (error) {
      /* 保存失败不打断界面；下次启动回到上次成功保存的值 */
    }
  }

  // 省电模式：立即关闭持续动画（body.power-saving）；窗口不透明在下次启动时生效。
  function applyPowerSaving(enabled) {
    document.body.classList.toggle("power-saving", Boolean(enabled));
    const toggle = document.getElementById("powerSaving");
    if (toggle) toggle.checked = Boolean(enabled);
  }

  async function loadPowerSaving() {
    try {
      if (!await waitForApi()) return;
      const result = await window.pywebview.api.get_power_saving();
      if (result && !result.error) applyPowerSaving(result.enabled);
    } catch (error) {
      /* 默认保持关闭 */
    }
  }

  async function setPowerSaving(enabled) {
    applyPowerSaving(enabled);   // 动画立即生效
    try {
      if (!await waitForApi()) return;
      await window.pywebview.api.set_power_saving(enabled);
    } catch (error) {
      /* 保存失败不打断界面 */
    }
  }

  async function minimizeWin() {
    if (!await waitForApi()) return;
    window.pywebview.api.minimize();
  }

  async function toggleSettings() {
    if (viewSwitching) return;
    viewSwitching = true;
    settingsOpen = !settingsOpen;
    const widget = document.querySelector(".widget");
    const page = document.getElementById("settingsPage");
    const button = document.getElementById("settingsButton");
    button.setAttribute("aria-pressed", String(settingsOpen));
    button.setAttribute("title", settingsOpen ? "关闭设置" : "打开设置");
    button.setAttribute("aria-label", settingsOpen ? "关闭设置" : "打开设置");

    if (settingsOpen) {
      widget.classList.add("settings-open");
      page.classList.remove("hidden");   // 浮现动画由 :not(.hidden) 触发
      setSettingsTab("general");
      viewSwitching = false;
      await loadTaskbarTheme();
    } else {
      await hideWithFade(page);
      widget.classList.remove("settings-open");   // 歌词区随之浮现
      viewSwitching = false;
      button.focus();
    }
  }

  function setSettingsTab(tab) {
    const isTaskbar = tab === "taskbar";
    document.getElementById("generalTab").setAttribute("aria-selected", String(!isTaskbar));
    document.getElementById("taskbarTab").setAttribute("aria-selected", String(isTaskbar));
    document.getElementById("generalPanel").classList.toggle("hidden", isTaskbar);
    document.getElementById("taskbarPanel").classList.toggle("hidden", !isTaskbar);
  }

  async function loadTaskbarTheme() {
    const status = document.getElementById("settingsSaveStatus");
    status.textContent = "读取中";
    status.classList.remove("error");
    try {
      const ready = await waitForApi();
      if (!ready) {
        taskbarTheme = Object.assign({}, themePresets.clear, { enabled: true, show_title: true });
        applyThemeToControls(taskbarTheme);
        document.getElementById("autostartEnabled").checked = false;
        status.textContent = "预览模式";
        return;
      }
      const [result, autostart] = await Promise.all([
        window.pywebview.api.get_taskbar_theme(),
        window.pywebview.api.get_autostart()
      ]);
      taskbarTheme = result && !result.error ? result : Object.assign({}, themePresets.clear, { enabled: true, show_title: true });
      applyThemeToControls(taskbarTheme);
      document.getElementById("autostartEnabled").checked = Boolean(autostart && !autostart.error && autostart.enabled);
      status.textContent = "实时保存";
    } catch (error) {
      status.textContent = "设置读取失败";
      status.classList.add("error");
    }
  }

  function applyThemeToControls(theme) {
    taskbarTheme = Object.assign({ enabled: true, show_title: true }, theme);
    document.getElementById("taskbarEnabled").checked = Boolean(taskbarTheme.enabled);
    document.getElementById("taskbarShowTitle").checked = Boolean(taskbarTheme.show_title);
    document.getElementById("themePreset").value = themePresets[taskbarTheme.preset] ? taskbarTheme.preset : "custom";
    document.getElementById("themeFontSize").value = taskbarTheme.font_size;
    document.getElementById("themeFontSizeValue").textContent = taskbarTheme.font_size + "px";
    document.getElementById("themeTextColor").value = taskbarTheme.text_color;
    document.getElementById("themeTextColorValue").textContent = taskbarTheme.text_color.toUpperCase();
    document.getElementById("themeTitleColor").value = taskbarTheme.title_color;
    document.getElementById("themeTitleColorValue").textContent = taskbarTheme.title_color.toUpperCase();
    document.getElementById("themeBackgroundColor").value = taskbarTheme.background_color;
    document.getElementById("themeBackgroundColorValue").textContent = taskbarTheme.background_color.toUpperCase();
    updateSegmentedButtons("font_weight", taskbarTheme.font_weight);
    updateSegmentedButtons("effect", taskbarTheme.effect);
    updateSegmentedButtons("background_mode", taskbarTheme.background_mode);
    updateThemePreview();
  }

  function updateSegmentedButtons(key, value) {
    document.querySelectorAll('[data-theme-key="' + key + '"]').forEach(button => {
      button.setAttribute("aria-pressed", String(button.dataset.themeValue === value));
    });
  }

  function updateThemePreview() {
    if (!taskbarTheme) return;
    const preview = document.getElementById("themePreview");
    const shadow = taskbarTheme.effect === "none"
      ? "none"
      : taskbarTheme.effect === "shadow"
        ? "2px 2px 0 #000"
        : "1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000";
    preview.style.setProperty("--preview-title", taskbarTheme.title_color);
    preview.style.setProperty("--preview-text", taskbarTheme.text_color);
    preview.style.setProperty("--preview-size", Math.max(14, taskbarTheme.font_size) + "px");
    preview.style.setProperty("--preview-weight", taskbarTheme.font_weight === "bold" ? "700" : "400");
    preview.style.setProperty("--preview-shadow", shadow);
    preview.style.setProperty(
      "--preview-background",
      taskbarTheme.background_mode === "solid" ? taskbarTheme.background_color : "rgba(25, 29, 36, 0.6)"
    );
  }

  function handleThemeControl(event) {
    const control = event.target;
    if (!taskbarTheme) return;
    const key = control.dataset.themeControl;

    if (key === "preset") {
      if (themePresets[control.value]) {
        taskbarTheme = Object.assign({}, taskbarTheme, themePresets[control.value]);
      } else {
        taskbarTheme.preset = "custom";
      }
    } else if (key) {
      taskbarTheme[key] = control.type === "checkbox"
        ? control.checked
        : control.type === "range"
          ? Number(control.value)
          : control.value;
      if (!["enabled", "show_title"].includes(key)) taskbarTheme.preset = "custom";
    }

    applyThemeToControls(taskbarTheme);
    scheduleTaskbarThemeSave();
  }

  function handleSegmentClick(event) {
    const button = event.currentTarget;
    if (!taskbarTheme) return;
    taskbarTheme[button.dataset.themeKey] = button.dataset.themeValue;
    taskbarTheme.preset = "custom";
    applyThemeToControls(taskbarTheme);
    scheduleTaskbarThemeSave();
  }

  function scheduleTaskbarThemeSave() {
    clearTimeout(themeSaveTimer);
    document.getElementById("settingsSaveStatus").textContent = "保存中";
    themeSaveTimer = setTimeout(saveTaskbarTheme, 180);
  }

  async function saveTaskbarTheme() {
    if (!taskbarTheme) return;
    try {
      if (!await waitForApi()) {
        document.getElementById("settingsSaveStatus").textContent = "预览模式";
        return;
      }
      const result = await window.pywebview.api.set_taskbar_theme(taskbarTheme);
      const status = document.getElementById("settingsSaveStatus");
      if (result && result.error) throw new Error(result.error);
      if (result && result.theme) taskbarTheme = result.theme;
      status.textContent = "已保存";
      status.classList.remove("error");
    } catch (error) {
      const status = document.getElementById("settingsSaveStatus");
      status.textContent = "保存失败";
      status.classList.add("error");
    }
  }

  async function resetTaskbarTheme() {
    try {
      if (!await waitForApi()) {
        applyThemeToControls(Object.assign({}, themePresets.clear, { enabled: true, show_title: true }));
        document.getElementById("taskbarSaveStatus").textContent = "预览模式";
        return;
      }
      const result = await window.pywebview.api.reset_taskbar_theme();
      if (result && result.theme) {
        applyThemeToControls(result.theme);
        document.getElementById("taskbarSaveStatus").textContent = "已恢复默认";
      }
    } catch (error) {
      document.getElementById("taskbarSaveStatus").textContent = "恢复失败";
      document.getElementById("taskbarSaveStatus").classList.add("error");
    }
  }

  async function handleAutostartControl(event) {
    const control = event.target;
    const requested = control.checked;
    let restored = !requested;
    const status = document.getElementById("settingsSaveStatus");
    control.disabled = true;
    status.textContent = "保存中";
    status.classList.remove("error");
    try {
      if (!await waitForApi()) throw new Error("桌面接口不可用");
      const result = await window.pywebview.api.set_autostart(requested);
      if (result && typeof result.enabled === "boolean") restored = result.enabled;
      if (!result || result.error) throw new Error(result && result.error ? result.error : "保存失败");
      control.checked = Boolean(result.enabled);
      status.textContent = "已保存";
    } catch (error) {
      control.checked = restored;
      status.textContent = "保存失败";
      status.classList.add("error");
    } finally {
      control.disabled = false;
    }
  }

  async function startSync() {
    if (!await waitForApi()) return;
    tick();
  }

  function setPlaybackState(state) {
    const dot = document.getElementById("statusDot");
    const label = document.getElementById("statusLabel");
    dot.classList.remove("playing", "error");
    document.body.classList.toggle("is-playing", state === "playing");

    if (state === "playing") {
      dot.classList.add("playing");
      label.textContent = "播放中";
    } else if (state === "paused") {
      label.textContent = "已暂停";
    } else if (state === "error") {
      dot.classList.add("error");
      label.textContent = "等待连接";
    } else {
      label.textContent = "等待播放";
    }
  }

  async function tick() {
    try {
      const data = await window.pywebview.api.auto_sync(false, !firstSyncDone);
      firstSyncDone = true;
      if (!data || data.error) {
        setPlaybackState("idle");
        scheduleNext(2000);
        return;
      }

      setPlaybackState(data.is_playing ? "playing" : (lyrics.length ? "paused" : "idle"));
      updatePlayPauseButton(Boolean(data.is_playing));
      showSongInfo(data.title, data.artist, data.album, data.cover_url);
      const mediaKey = JSON.stringify([data.media_title || data.title, data.media_artist || data.artist]);
      const nowTitle = data.media_title || data.title;
      const nowArtist = data.media_artist || data.artist;
      queuePanel.setNowPlaying(nowTitle, nowArtist, Boolean(data.is_playing));
      mineSetNowPlaying(nowTitle, nowArtist, Boolean(data.is_playing));

      if (userOffset === null && typeof data.user_offset === "number") {
        userOffset = data.user_offset;
        updateOffsetLabel();
      }

      if (mediaKey !== displayedMediaKey || data.song_changed) {
        displayedMediaKey = mediaKey;
        // The backend only carries the lyric array on song change; keep the
        // currently rendered lyrics when it omits them.
        if (Array.isArray(data.lyrics)) lyrics = data.lyrics;
        lrcOffset = data.lrc_offset || 0;
        currentIndex = -1;
        renderLyrics();
      }

      if (typeof data.position_ms === "number") {
        // Cache the sync point; a 200ms local timer interpolates the position
        // between polls so the bridge only carries a light payload.
        syncPoint = {
          position_ms: data.position_ms,
          duration_ms: data.duration_ms,
          is_playing: Boolean(data.is_playing),
          at: performance.now(),
        };
        const effectiveMs = data.position_ms - lrcOffset - (userOffset || 0);
        if (lyrics.length) updateHighlight(effectiveMs);
        updateProgress(data.position_ms, data.duration_ms);
      }

      scheduleNext(data.is_playing ? 1000 : 2000);
    } catch (error) {
      setPlaybackState("error");
      scheduleNext(2000);
    }
  }

  // Local interpolation of the cached sync point: keeps the progress bar and
  // lyric highlight smooth without pushing payloads over the bridge. Power
  // saving mode slows the loop down (less DOM churn, less compositor work).
  function renderLoopTick() {
    if (!document.hidden && syncPoint && syncPoint.is_playing && !userSeeking) {
      const pos = Math.min(
        syncPoint.position_ms + (performance.now() - syncPoint.at),
        syncPoint.duration_ms || Infinity,
      );
      if (lyrics.length) updateHighlight(pos - lrcOffset - (userOffset || 0));
      updateProgress(pos, syncPoint.duration_ms);
    }
    const delay = document.body.classList.contains("power-saving") ? 500 : 200;
    setTimeout(renderLoopTick, delay);
  }
  renderLoopTick();

  function scheduleNext(ms) {
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(tick, ms);
  }

  function showSongInfo(title, artist, album = "", coverUrl = "") {
    document.getElementById("songTitle").textContent = title || "未知歌曲";
    document.getElementById("songArtist").textContent = artist || "未知歌手";
    document.getElementById("songAlbum").textContent = album || "QQ 音乐";
    setCoverArtwork(coverUrl || "");
  }

  function setCoverArtwork(url) {
    const cover = document.getElementById("albumCover");
    const backdrop = document.getElementById("albumBackdrop");
    const frame = document.getElementById("coverFrame");
    if (cover.dataset.source === url) return;
    cover.dataset.source = url;
    frame.classList.remove("has-cover");
    backdrop.classList.remove("is-loaded");

    if (!url) {
      cover.removeAttribute("src");
      backdrop.removeAttribute("src");
      return;
    }

    cover.onload = () => frame.classList.add("has-cover");
    cover.onerror = () => frame.classList.remove("has-cover");
    backdrop.onload = () => backdrop.classList.add("is-loaded");
    backdrop.onerror = () => backdrop.classList.remove("is-loaded");
    cover.src = url;
    backdrop.src = url;
  }

  function updatePlayPauseButton(isPlaying) {
    const button = document.getElementById("playPauseButton");
    const label = isPlaying ? "暂停" : "播放";
    button.textContent = isPlaying ? "\u23F8" : "\u25B6";
    button.setAttribute("aria-label", label);
    button.setAttribute("title", label);
    button.setAttribute("aria-pressed", String(isPlaying));
  }

  async function sendPlaybackAction(action, button = null, positionMs = null) {
    const status = document.getElementById("controlStatus");
    if (button) {
      button.disabled = true;
      button.dataset.state = "loading";
    }
    status.textContent = action === "seek" ? "定位中" : "控制中";
    status.classList.remove("error");

    try {
      if (!await waitForApi()) throw new Error("桌面接口不可用");
      const result = await window.pywebview.api.control_playback(action, positionMs);
      if (!result || result.error) throw new Error(result && result.error ? result.error : "播放控制不可用");
      if (button) button.dataset.state = "success";
      status.textContent = "";
      scheduleNext(120);
    } catch (error) {
      if (button) button.dataset.state = "error";
      status.textContent = "控制失败";
      status.classList.add("error");
    } finally {
      if (button) {
        button.disabled = false;
        setTimeout(() => button.removeAttribute("data-state"), 900);
      }
    }
  }

  function renderLyrics() {
    const area = document.getElementById("lyricsArea");
    if (!lyrics.length) {
      area.innerHTML = '<div class="empty-state"><p class="empty-title">当前歌曲暂无可用歌词</p><p class="empty-copy">播放控制和歌单仍可使用。</p></div>';
      return;
    }
    let html = '<div class="lyrics-spacer-top"></div>';

    for (let i = 0; i < lyrics.length; i++) {
      html += '<div class="lyric-pair" id="pair-' + i + '">';
      html += '<div class="lyric-line" id="line-' + i + '">' + esc(lyrics[i].text) + '</div>';
      if (lyrics[i].trans) {
        html += '<div class="lyric-trans" id="trans-' + i + '">' + esc(lyrics[i].trans) + '</div>';
      }
      html += '</div>';
    }

    html += '<div class="lyrics-spacer-bottom"></div>';
    area.innerHTML = html;
  }

  function updateHighlight(positionMs) {
    let idx = -1;
    for (let i = lyrics.length - 1; i >= 0; i--) {
      if (positionMs >= lyrics[i].time_ms) {
        idx = i;
        break;
      }
    }

    if (idx === currentIndex) return;
    currentIndex = idx;

    for (let i = 0; i < lyrics.length; i++) {
      const pair = document.getElementById("pair-" + i);
      if (!pair) continue;
      pair.classList.toggle("active", i === currentIndex);
      pair.classList.toggle("past", i < currentIndex);
    }

    if (currentIndex >= 0) {
      const activePair = document.getElementById("pair-" + currentIndex);
      const area = document.getElementById("lyricsArea");
      if (activePair && area) {
        // Keep lyric auto-scroll inside its own pane so a song change cannot move the card page.
        const areaRect = area.getBoundingClientRect();
        const pairRect = activePair.getBoundingClientRect();
        const targetTop = area.scrollTop
          + (pairRect.top - areaRect.top)
          - (area.clientHeight - activePair.offsetHeight) / 2;
        const maxTop = Math.max(0, area.scrollHeight - area.clientHeight);
        area.scrollTo({
          top: Math.max(0, Math.min(maxTop, targetTop)),
          behavior: motionOn() ? "smooth" : "auto"
        });
      }
    }
  }

  function updateProgress(posMs, durMs) {
    const seek = document.getElementById("progressSeek");
    if (!durMs || durMs <= 0) {
      currentDurationMs = 0;
      seek.value = 0;
      seek.style.setProperty("--seek-progress", "0%");
      return;
    }
    currentDurationMs = durMs;
    const pct = Math.max(0, Math.min(100, (posMs / durMs) * 100));
    if (!userSeeking) seek.value = pct;
    seek.style.setProperty("--seek-progress", (userSeeking ? seek.value : pct) + "%");
    document.getElementById("posLabel").textContent = msToTime(posMs);
    document.getElementById("durLabel").textContent = msToTime(durMs);
  }

  function updateOffsetLabel() {
    const safeOffset = Number.isFinite(userOffset) ? userOffset : 0;
    document.getElementById("offsetValue").textContent = (safeOffset / 1000).toFixed(1) + "s";
  }

  function adjustOffset(delta) {
    if (!Number.isFinite(userOffset)) userOffset = 0;
    userOffset += delta;
    updateOffsetLabel();

    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.set_user_offset(userOffset);
    }

    currentIndex = -1;
  }

  function setSearchLoading(loading) {
    const button = document.getElementById("searchButton");
    button.disabled = loading;
    button.textContent = loading ? "搜索中" : "搜索";
  }

  function showSearchMessage(message, isError = false) {
    const el = document.getElementById("searchResults");
    el.classList.remove("hidden");
    el.innerHTML = '<div class="search-message' + (isError ? ' error' : '') + '">' + esc(message) + '</div>';
  }

  async function doSearch() {
    const input = document.getElementById("searchInput");
    const keyword = input.value.trim();
    if (!keyword) {
      input.focus();
      return;
    }

    setSearchLoading(true);
    setContentView("search");   // 搜索结果作为独立视图浮现，不与歌单/歌词重合
    showSearchMessage("正在查找歌曲...");

    try {
      if (!await waitForApi()) {
        showSearchMessage("搜索需要桌面接口。", true);
        return;
      }
      const results = await window.pywebview.api.search(keyword);
      if (results && results.error) {
        showSearchMessage(results.error, true);
      } else {
        showResults(Array.isArray(results) ? results : []);
      }
    } catch (error) {
      showSearchMessage("搜索失败，请稍后重试。", true);
    } finally {
      setSearchLoading(false);
    }
  }

  function showResults(results) {
    const el = document.getElementById("searchResults");
    el.classList.remove("hidden");

    if (!results.length) {
      showSearchMessage("没有找到匹配的歌曲。");
      return;
    }

    el.innerHTML = results.map((result, index) =>
      '<button type="button" class="result-item" role="option" onclick="selectSong(' + index + ')">' +
        '<div class="result-name">' + esc(result.songname) + '</div>' +
        '<div class="result-meta">' + esc(result.singer) + '</div>' +
      '</button>'
    ).join("");
    window._searchResults = results;
  }

  async function selectSong(index) {
    const result = window._searchResults && window._searchResults[index];
    if (!result) return;

    showSearchMessage("正在加载歌词...");

    try {
      if (!await waitForApi()) {
        showSearchMessage("歌词加载需要桌面接口。", true);
        return;
      }
      const data = await window.pywebview.api.load_lyrics(
        result.songmid,
        result.songname,
        result.singer,
        result.albumname || "",
        result.cover_url || ""
      );

      if (data && data.error) {
        showSearchMessage(data.error, true);
        return;
      }

      if (data && data.lyrics) {
        lyrics = data.lyrics;
        lrcOffset = data.lrc_offset || 0;
        currentIndex = -1;
        showSongInfo(data.title, data.artist, data.album, data.cover_url);
        setContentView("lyrics");   // 回到歌词视图并浮现新歌词
        renderLyrics();
      }
    } catch (error) {
      showSearchMessage("歌词加载失败，请稍后重试。", true);
    }
  }

  const queuePanel = createSongListPanel({
    root: "#playlistPanel",
    count: "#playlistCount",
    message: "#playlistMessage",
    items: "#playlistItems",
    previousBtn: "#playlistPrevious",
    nextBtn: "#playlistNext",
    loadApi: direction => window.pywebview.api.get_qq_playlist(direction),
    playApi: (itemId, pageToken) => window.pywebview.api.play_qq_playlist_item(itemId, pageToken),
    loadingText: "正在读取 QQ 音乐播放队列…",
    successText: () => "点击歌曲在 QQ 音乐中播放；翻页时会显示客户端队列。",
    emptyText: () => "QQ 音乐播放队列为空，请先在客户端播放歌曲。",
    errorCountText: "尚未连接到客户端队列",
    countText: data => "共 " + data.total + " 首 · 本页 " + data.items.length + " 首",
    playLoadingText: "正在让 QQ 音乐切换歌曲…",
    playSuccessText: result => "已切换到「" + result.title + "」。",
    playErrorText: "切歌失败，请刷新后重试",
    onPlayed: () => scheduleNext(100),
  });

  // ── 我的歌单：账号真实歌单（QQ 音乐公开 Web 接口）──

  const MINE_PAGE_SIZE = 30;
  let mineLevel = "playlists";
  let mineLoading = false;
  let mineLoaded = false;
  let minePlaylist = null;      // {tid, name, song_num}
  let mineBegin = 0;
  let mineHasMore = false;
  let mineNowPlaying = { title: "", artist: "", playing: false };

  function mineMsg(text, error = false) {
    const el = document.getElementById("mineMessage");
    el.textContent = text;
    el.classList.toggle("error", Boolean(error));
  }

  function mineSetBusy(value) {
    mineLoading = value;
    document.getElementById("minePanel").setAttribute("aria-busy", String(value));
    document.querySelectorAll("#minePanel button").forEach(button => { button.disabled = value; });
    if (!value) {
      const songs = mineLevel === "songs";
      document.getElementById("minePrevious").disabled = songs && mineBegin === 0;
      document.getElementById("mineNext").disabled = songs && !mineHasMore;
      document.getElementById("mineBack").hidden = !songs;
    }
  }

  function mineCover(src, cls) {
    const img = document.createElement("img");
    img.className = cls;
    img.loading = "lazy";
    img.src = src || "";
    img.onerror = () => img.remove();
    return img;
  }

  function mineNormalize(text) {
    return String(text || "").toLocaleLowerCase().replace(/\s/g, "");
  }

  function mineHighlight() {
    if (mineLevel !== "songs") return;
    document.querySelectorAll("#mineItems .mine-song").forEach(row => {
      const current = mineNormalize(row.dataset.title) === mineNormalize(mineNowPlaying.title)
        && mineNormalize(row.dataset.artist) === mineNormalize(mineNowPlaying.artist);
      row.setAttribute("aria-current", String(current));
      row.querySelector(".playlist-marker").textContent =
        current ? (mineNowPlaying.playing ? "播放中" : "已暂停") : "播放";
    });
  }

  function mineSetNowPlaying(title, artist, playing) {
    mineNowPlaying = { title: title || "", artist: artist || "", playing: Boolean(playing) };
    mineHighlight();
  }

  async function loadMinePlaylists() {
    if (mineLoading) return;
    mineSetBusy(true);
    mineMsg("正在读取账号歌单…");
    try {
      if (!await waitForApi()) throw new Error("桌面接口不可用");
      const data = await window.pywebview.api.get_qq_account_playlists();
      if (!data || data.error) throw new Error(data?.error || "读取失败");
      mineLevel = "playlists";
      mineLoaded = true;
      document.getElementById("mineBack").hidden = true;
      const container = document.getElementById("mineItems");
      container.replaceChildren();
      document.getElementById("mineCount").textContent = "我的歌单 · " + data.playlists.length + " 个";
      document.getElementById("mineHint").textContent = "来自账号的真实数据";
      for (const pl of data.playlists) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "mine-card";
        card.appendChild(mineCover(pl.cover_url, "mine-cover"));
        const box = document.createElement("span");
        box.className = "mine-card-text";
        const name = document.createElement("span");
        name.className = "playlist-title";
        name.textContent = pl.name;
        const count = document.createElement("span");
        count.className = "playlist-artist";
        count.textContent = pl.song_num + " 首";
        box.append(name, count);
        card.appendChild(box);
        card.addEventListener("click", () => openMinePlaylist(pl));
        container.appendChild(card);
      }
      mineMsg("点击歌单浏览真实歌曲数据（ songmid / 封面 / 专辑）。");
    } catch (error) {
      document.getElementById("mineItems").replaceChildren();
      document.getElementById("mineCount").textContent = "尚未连接到账号歌单";
      mineMsg(error.message || "读取失败", true);
    } finally {
      mineSetBusy(false);
    }
  }

  async function openMinePlaylist(playlist, begin = 0) {
    if (mineLoading) return;
    mineSetBusy(true);
    minePlaylist = playlist;
    mineBegin = begin;
    mineMsg("正在读取「" + playlist.name + "」的歌曲…");
    try {
      if (!await waitForApi()) throw new Error("桌面接口不可用");
      const data = await window.pywebview.api.get_qq_account_playlist_songs(playlist.tid, mineBegin, MINE_PAGE_SIZE);
      if (!data || data.error) throw new Error(data?.error || "读取失败");
      mineLevel = "songs";
      mineLoaded = true;
      mineHasMore = data.has_more;
      renderMineSongs(data.songs);
      const range = (mineBegin + 1) + "-" + (mineBegin + data.songs.length);
      mineMsg("「" + playlist.name + "」共 " + playlist.song_num + " 首 · 点击歌曲播放。");
    } catch (error) {
      mineMsg(error.message || "读取失败", true);
    } finally {
      mineSetBusy(false);
    }
  }

  function renderMineSongs(songs) {
    const container = document.getElementById("mineItems");
    container.replaceChildren();
    document.getElementById("mineCount").textContent =
      minePlaylist.name + " · 共 " + minePlaylist.song_num + " 首";
    document.getElementById("mineHint").textContent =
      (mineBegin + 1) + "-" + (mineBegin + songs.length);
    for (const song of songs) {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "playlist-row mine-song";
      row.dataset.title = song.songname;
      row.dataset.artist = song.singer;
      row.setAttribute("aria-label", "播放 " + song.songname + "，" + song.singer);
      row.appendChild(mineCover(song.cover_url, "playlist-cover"));
      for (const [className, text] of [["playlist-title", song.songname], ["playlist-artist", song.singer], ["playlist-marker", "播放"]]) {
        const span = document.createElement("span");
        span.className = className;
        span.textContent = text;
        row.appendChild(span);
      }
      row.addEventListener("click", () => playMineSong(song));
      container.appendChild(row);
    }
    mineHighlight();
  }

  async function playMineSong(song) {
    if (mineLoading) return;
    mineSetBusy(true);
    mineMsg("正在让 QQ 音乐播放「" + song.songname + "」…");
    try {
      const result = await window.pywebview.api.play_qq_account_song(song.songname, song.singer);
      if (!result || result.error || !result.verified) throw new Error(result?.error || "尚未确认播放");
      mineMsg("已在 QQ 音乐播放「" + result.title + "」。");
      scheduleNext(100);
    } catch (error) {
      mineMsg(error.message || "点歌失败，请刷新后重试", true);
    } finally {
      mineSetBusy(false);
    }
  }

  function minePage(direction) {
    if (!minePlaylist) return;
    const begin = mineBegin + direction * MINE_PAGE_SIZE;
    if (begin < 0) return;
    openMinePlaylist(minePlaylist, begin);
  }

  function mineBack() {
    minePlaylist = null;
    loadMinePlaylists();
  }

  function mineReload() {
    if (mineLevel === "songs" && minePlaylist) openMinePlaylist(minePlaylist, mineBegin);
    else loadMinePlaylists();
  }

  // 视图切换：旧视图淡出（隐），新视图淡入 + 轻缩放浮现（现）；关动效时瞬时切换
  function fadeOutView(el) {
    if (!el || !motionOn()) return Promise.resolve();
    return new Promise(resolve => {
      el.classList.add("view-leaving");
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        el.classList.remove("view-leaving");
        resolve();
      };
      el.addEventListener("animationend", finish, { once: true });
      setTimeout(finish, 300);
    });
  }

  function hideWithFade(el) {
    if (!el) return Promise.resolve();
    return fadeOutView(el).then(() => el.classList.add("hidden"));
  }

  async function setContentView(view) {
    if (view === activeView || viewSwitching) return;
    viewSwitching = true;
    const section = document.querySelector(".lyrics-section");

    // 先隐去当前视图
    if (activeView === "lyrics") {
      await fadeOutView(document.getElementById("lyricsArea"));
      section.classList.add("queue-open");
    } else if (activeView === "playlist") {
      await hideWithFade(document.getElementById("playlistPanel"));
    } else if (activeView === "mine") {
      await hideWithFade(document.getElementById("minePanel"));
    } else if (activeView === "search") {
      await hideWithFade(document.getElementById("searchResults"));
    }

    // 再浮现目标视图（浮现动画由 :not(.hidden) / :not(.queue-open) 规则触发）
    if (view === "lyrics") {
      section.classList.remove("queue-open");
    } else if (view === "playlist") {
      document.getElementById("playlistPanel").classList.remove("hidden");
    } else if (view === "mine") {
      document.getElementById("minePanel").classList.remove("hidden");
    } else if (view === "search") {
      document.getElementById("searchResults").classList.remove("hidden");
    }
    document.getElementById("lyricsViewTab").setAttribute("aria-selected", String(view === "lyrics"));
    document.getElementById("playlistViewTab").setAttribute("aria-selected", String(view === "playlist"));
    document.getElementById("mineViewTab").setAttribute("aria-selected", String(view === "mine"));
    activeView = view;
    viewSwitching = false;

    if (view === "playlist" && !queuePanel.hasData() && !queuePanel.isBusy()) queuePanel.load("refresh");
    if (view === "mine" && !mineLoaded && !mineLoading) loadMinePlaylists();
  }

  function msToTime(ms) {
    if (!ms || ms < 0) ms = 0;
    const seconds = Math.floor(ms / 1000);
    const minutes = Math.floor(seconds / 60);
    const remainder = seconds % 60;
    return minutes + ":" + String(remainder).padStart(2, "0");
  }

  function esc(value) {
    const element = document.createElement("div");
    element.textContent = value || "";
    return element.innerHTML;
  }

  document.addEventListener("visibilitychange", () => {
    document.body.classList.toggle("doc-hidden", document.hidden);
  });

  document.getElementById("searchInput").addEventListener("keydown", event => {
    if (event.key === "Enter") doSearch();
    if (event.key === "Escape" && activeView === "search") {
      setContentView("lyrics");
    }
  });

  const progressSeek = document.getElementById("progressSeek");
  progressSeek.addEventListener("pointerdown", () => {
    userSeeking = true;
  });
  progressSeek.addEventListener("input", event => {
    userSeeking = true;
    const pct = Number(event.target.value);
    event.target.style.setProperty("--seek-progress", pct + "%");
    if (currentDurationMs > 0) {
      document.getElementById("posLabel").textContent = msToTime(currentDurationMs * pct / 100);
    }
  });
  progressSeek.addEventListener("change", event => {
    const pct = Number(event.target.value);
    const targetMs = currentDurationMs > 0 ? Math.round(currentDurationMs * pct / 100) : 0;
    userSeeking = false;
    if (currentDurationMs > 0) sendPlaybackAction("seek", null, targetMs);
  });
  progressSeek.addEventListener("pointerup", () => {
    userSeeking = false;
  });

  document.addEventListener("click", event => {
    if (!event.target.closest(".search-wrap")) {
      document.getElementById("searchResults").classList.add("hidden");
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && settingsOpen) {
      toggleSettings();
    }
  });

  document.querySelectorAll("[data-theme-control]").forEach(control => {
    control.addEventListener(control.type === "range" || control.type === "color" ? "input" : "change", handleThemeControl);
  });
  document.querySelectorAll("[data-theme-key]").forEach(button => {
    button.addEventListener("click", handleSegmentClick);
  });
  document.querySelectorAll("[data-autostart-control]").forEach(control => {
    control.addEventListener("change", handleAutostartControl);
  });
  document.getElementById("motionEnabled").addEventListener("change", event => {
    setUiMotion(event.target.checked);
  });
  document.getElementById("powerSaving").addEventListener("change", event => {
    setPowerSaving(event.target.checked);
  });

  loadUiMotion();
  loadPowerSaving();
  startSync();
</script>
</body>
</html>
