<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ音乐歌词</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --glass-bg: rgba(20, 20, 40, 0.72);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-blur: 20px;
    --accent: #a78bfa;
    --accent-glow: rgba(167, 139, 250, 0.4);
    --accent-dim: rgba(167, 139, 250, 0.15);
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-muted: #64748b;
    --radius: 14px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  html, body {
    height: 100%;
    font-family: "Inter", "Microsoft YaHei", system-ui, sans-serif;
    background: transparent;
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }
  .widget {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .win-btn {
    -webkit-app-region: no-drag;
    background: rgba(255,255,255,0.06);
    border: none;
    border-radius: 6px;
    width: 28px; height: 28px;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
    line-height: 1;
    margin-left: 6px;
  }
  .win-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }

  .header {
    -webkit-app-region: drag;
    padding: 16px 18px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
  .header .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #64748b;
    margin-left: auto;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .header .status-dot.playing { background: #34d399; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  .song-info {
    padding: 4px 18px 8px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .song-info.hidden { display: none; }
  .song-info .title { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-info .artist { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .search-bar {
    padding: 0 14px 8px;
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .search-bar input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border var(--transition);
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text-muted); }
  .search-bar button {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity var(--transition);
    white-space: nowrap;
  }
  .search-bar button:hover { opacity: 0.85; }

  .search-results {
    padding: 0 12px 6px;
    max-height: 160px;
    overflow-y: auto;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .search-results.hidden { display: none; }
  .search-results::-webkit-scrollbar { width: 3px; }
  .search-results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  .result-item {
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background var(--transition);
    margin-bottom: 3px;
  }
  .result-item:hover { background: rgba(255,255,255,0.06); }
  .result-item .name { font-size: 13px; font-weight: 500; }
  .result-item .meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .lyrics-area {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 20px;
    -webkit-app-region: no-drag;
    scroll-behavior: smooth;
  }
  .lyrics-area::-webkit-scrollbar { width: 4px; }
  .lyrics-area::-webkit-scrollbar-track { background: transparent; }
  .lyrics-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .lyric-line {
    padding: 6px 0;
    font-size: 14px;
    color: var(--text-muted);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: center;
    line-height: 1.6;
    cursor: pointer;
  }
  .lyric-line:hover { color: var(--text-dim); }
  .lyric-line.active {
    color: var(--accent);
    font-size: 17px;
    font-weight: 600;
    text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(167,139,250,0.15);
    transform: scale(1.03);
  }
  .lyric-line.past { color: var(--text-dim); opacity: 0.45; }
  .lyric-trans {
    font-size: 12px;
    color: rgba(148, 163, 184, 0.6);
    text-align: center;
    line-height: 1.4;
    padding: 0 0 4px 0;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .lyric-line.active + .lyric-trans,
  .lyric-line.active ~ .lyric-trans:first-of-type {
    color: rgba(167, 139, 250, 0.6);
  }
  .lyrics-spacer-top { height: 35%; }
  .lyrics-spacer-bottom { height: 35%; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 10px;
    padding: 40px;
  }
  .empty-state .icon { font-size: 44px; opacity: 0.35; }
  .empty-state p { font-size: 13px; text-align: center; line-height: 1.5; }

  .controls {
    padding: 6px 14px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .controls .time-label {
    font-size: 11px;
    color: var(--text-muted);
    min-width: 38px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .controls .progress-bar {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    position: relative;
    overflow: hidden;
  }
  .controls .progress-bar .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.3s linear;
  }

  .offset-bar {
    padding: 0 14px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .offset-bar .label { font-size: 11px; color: var(--text-muted); }
  .offset-bar button {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    padding: 4px 10px;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .offset-bar button:hover { background: rgba(255,255,255,0.12); color: var(--text); }
  .offset-bar .offset-value {
    font-size: 12px;
    color: var(--accent);
    min-width: 50px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <h1>&#127925; 歌词</h1>
    <div class="status-dot" id="statusDot" title="播放状态"></div>
    <button class="win-btn" onclick="minimizeWin()" title="最小化">–</button>
  </div>

  <div class="song-info hidden" id="songInfo">
    <div class="title" id="songTitle"></div>
    <div class="artist" id="songArtist"></div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索歌曲..." />
    <button onclick="doSearch()">搜索</button>
  </div>

  <div class="search-results hidden" id="searchResults"></div>

  <div class="lyrics-area" id="lyricsArea">
    <div class="empty-state" id="emptyState">
      <div class="icon">&#127926;</div>
      <p>正在等待QQ音乐播放...</p>
      <p style="font-size:11px;color:#64748b">播放后歌词将自动同步显示</p>
    </div>
  </div>

  <div class="offset-bar" id="offsetBar">
    <span class="label">延迟调整</span>
    <button onclick="adjustOffset(-500)">-0.5s</button>
    <button onclick="adjustOffset(-100)">-0.1s</button>
    <span class="offset-value" id="offsetValue">0.0s</span>
    <button onclick="adjustOffset(100)">+0.1s</button>
    <button onclick="adjustOffset(500)">+0.5s</button>
  </div>

  <div class="controls" id="controls">
    <span class="time-label" id="posLabel">0:00</span>
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    <span class="time-label" id="durLabel">0:00</span>
  </div>
</div>

<script>
  let lyrics = [];
  let currentIndex = -1;
  let userOffset = 0;
  let lrcOffset = 0;
  let lastTitle = "";
  let syncTimer = null;

  function waitForApi() {
    return new Promise(resolve => {
      const check = () => {
        if (window.pywebview && window.pywebview.api) resolve();
        else setTimeout(check, 100);
      };
      check();
    });
  }

  async function minimizeWin() {
    await waitForApi();
    window.pywebview.api.minimize();
  }

  async function startSync() {
    await waitForApi();
    tick();
  }

  async function tick() {
    try {
      const data = await window.pywebview.api.auto_sync();
      if (!data || data.error) {
        scheduleNext(2000);
        return;
      }

      // Update playback state indicator
      const dot = document.getElementById("statusDot");
      if (data.is_playing) {
        dot.classList.add("playing");
      } else {
        dot.classList.remove("playing");
      }

      // Song changed -> reload lyrics
      if (data.song_changed && data.lyrics && data.lyrics.length) {
        lyrics = data.lyrics;
        lrcOffset = data.lrc_offset || 0;
        currentIndex = -1;
        lastTitle = data.title || "";

        // Show song info
        const info = document.getElementById("songInfo");
        info.classList.remove("hidden");
        document.getElementById("songTitle").textContent = data.title || "";
        document.getElementById("songArtist").textContent = data.artist || "";

        renderLyrics();
      }

      // Sync lyrics position
      if (lyrics.length && typeof data.position_ms === "number") {
        const effectiveMs = data.position_ms - lrcOffset - userOffset;
        updateHighlight(effectiveMs);
        updateProgress(data.position_ms, data.duration_ms);
      }

      // Schedule next poll
      scheduleNext(data.is_playing ? 200 : 1000);

    } catch (e) {
      scheduleNext(2000);
    }
  }

  function scheduleNext(ms) {
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(tick, ms);
  }

  function renderLyrics() {
    const area = document.getElementById("lyricsArea");
    document.getElementById("emptyState").style.display = "none";
    let html = '<div class="lyrics-spacer-top"></div>';
    for (let i = 0; i < lyrics.length; i++) {
      html += '<div class="lyric-line" id="line-' + i + '">' + esc(lyrics[i].text) + '</div>';
      if (lyrics[i].trans) {
        html += '<div class="lyric-trans" id="trans-' + i + '">' + esc(lyrics[i].trans) + '</div>';
      }
    }
    html += '<div class="lyrics-spacer-bottom"></div>';
    area.innerHTML = html;
  }

  function updateHighlight(positionMs) {
    let idx = -1;
    for (let i = lyrics.length - 1; i >= 0; i--) {
      if (positionMs >= lyrics[i].time_ms) { idx = i; break; }
    }
    if (idx === currentIndex) return;

    // Remove old active
    if (currentIndex >= 0) {
      const old = document.getElementById("line-" + currentIndex);
      if (old) { old.classList.remove("active"); old.classList.add("past"); }
    }
    currentIndex = idx;

    if (currentIndex >= 0) {
      const el = document.getElementById("line-" + currentIndex);
      if (el) {
        el.classList.add("active");
        el.classList.remove("past");
        el.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      for (let i = 0; i < currentIndex; i++) {
        const prev = document.getElementById("line-" + i);
        if (prev) prev.classList.add("past");
      }
      // Lines after current should not be past
      for (let i = currentIndex + 1; i < lyrics.length; i++) {
        const nxt = document.getElementById("line-" + i);
        if (nxt) nxt.classList.remove("past");
        const nxtT = document.getElementById("trans-" + i);
        if (nxtT) nxtT.classList.remove("past");
      }
      // Mark current trans as active style
      const curTrans = document.getElementById("trans-" + currentIndex);
      if (curTrans) curTrans.style.color = "rgba(167, 139, 250, 0.6)";
      // Reset previous trans
      if (currentIndex > 0) {
        const prevTrans = document.getElementById("trans-" + (currentIndex - 1));
        if (prevTrans) prevTrans.style.color = "";
      }
    }
  }

  function updateProgress(posMs, durMs) {
    if (!durMs || durMs <= 0) return;
    const pct = Math.min(100, (posMs / durMs) * 100);
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("posLabel").textContent = msToTime(posMs);
    document.getElementById("durLabel").textContent = msToTime(durMs);
  }

  function adjustOffset(delta) {
    userOffset += delta;
    document.getElementById("offsetValue").textContent = (userOffset / 1000).toFixed(1) + "s";
    // Notify backend
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.set_user_offset(userOffset);
    }
    // Force re-evaluate highlight
    currentIndex = -1;
  }

  // Manual search
  async function doSearch() {
    const kw = document.getElementById("searchInput").value.trim();
    if (!kw) return;
    await waitForApi();
    const results = await window.pywebview.api.search(kw);
    if (results.error) return alert(results.error);
    showResults(results);
  }

  function showResults(results) {
    const el = document.getElementById("searchResults");
    if (!results.length) { el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    el.innerHTML = results.map((r, i) =>
      '<div class="result-item" onclick="selectSong(' + i + ')">' +
        '<div class="name">' + esc(r.songname) + '</div>' +
        '<div class="meta">' + esc(r.singer) + '</div>' +
      '</div>'
    ).join("");
    window._searchResults = results;
  }

  async function selectSong(idx) {
    const r = window._searchResults[idx];
    if (!r) return;
    await waitForApi();
    const data = await window.pywebview.api.load_lyrics(r.songmid, r.songname, r.singer);
    if (data.error) return alert(data.error);
    if (data.lyrics) {
      lyrics = data.lyrics;
      lrcOffset = data.lrc_offset || 0;
      currentIndex = -1;
      lastTitle = data.title || "";
      const info = document.getElementById("songInfo");
      info.classList.remove("hidden");
      document.getElementById("songTitle").textContent = data.title || "";
      document.getElementById("songArtist").textContent = data.artist || "";
      document.getElementById("searchResults").classList.add("hidden");
      renderLyrics();
    }
  }

  function msToTime(ms) {
    if (!ms || ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return m + ":" + String(ss).padStart(2, "0");
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  document.getElementById("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter") doSearch();
  });

  startSync();
</script>
</body>
</html>
